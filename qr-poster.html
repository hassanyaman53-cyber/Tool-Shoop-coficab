<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFICAB - Tool Shop QR Poster</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .poster {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border: 4px solid #0088cc;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .logo {
      font-size: 38px;
      font-weight: 900;
      color: #0088cc;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    .sub-logo {
      font-size: 14px;
      color: #555;
      font-weight: 600;
      margin-bottom: 25px;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      color: #111;
      margin-bottom: 10px;
    }
    .description {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .qr-box {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      border: 2px dashed #0088cc;
      display: inline-block;
      margin-bottom: 25px;
    }
    .qr-box img {
      width: 250px;
      height: 250px;
      display: block;
    }
    .instructions {
      background: #0088cc;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
    .print-btn {
      background-color: #1a252f;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .poster {
        border: 4px solid #0088cc;
        box-shadow: none;
      }
      .print-btn {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="poster">
    <div class="logo">COFICAB</div>
    <div class="sub-logo">Tool Shop & Die Shop Management</div>

    <div class="title">نظام البحث الرقمي ومتابعة العُدد والدايات</div>
    <div class="description">إدارة وتتبع مكونات خطوط السحب والكبس وورش الصيانة</div>

    <div class="qr-box">
      <!-- الـ QR هنا مبرمج يفتح صفحة البحث index.html -->
      <img src="https://quickchart.io/qr?text=https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/index.html&size=400&margin=4" alt="QR Code">
    </div>

    <div>
      <div class="instructions">📱 امسح الرمز بالموبايل للوصول الفوري</div>
    </div>

    <button class="print-btn" onclick="window.print()">🖨️ طباعة البوستر الآن</button>
  </div>

</body>
</html>
