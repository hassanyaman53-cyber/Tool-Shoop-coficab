<!-- QR Code Card -->
<section id="qr-print-area" class="qr-card">
  <h2>COFICAB TOOL SHOP</h2>
  <p>امسح الكود لفتح أداة البحث</p>

  <div class="qr-frame">
    <div id="qrcode"></div>

    <!-- شعار الشركة داخل QR -->
    <img
      class="qr-logo"
      src="./coficab-logo.png"
      alt="COFICAB Logo"
    />
  </div>

  <div class="qr-url">
    https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/
  </div>

  <button id="print-qr" type="button">
    🖨️ طباعة QR Code
  </button>
</section>

<!-- مكتبة إنشاء QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const toolShopUrl =
    "https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/";

  const qrContainer = document.getElementById("qrcode" );

  new QRCode(qrContainer, {
    text: toolShopUrl,
    width: 240,
    height: 240,
    colorDark: "#082f49",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById("print-qr").addEventListener("click", function () {
    window.print();
  });
</script>
