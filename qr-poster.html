<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>COFICAB Tool Shop QR</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef2f5;font-family:Segoe UI,Arial,sans-serif}.card{background:white;text-align:center;padding:35px;border-radius:22px;box-shadow:0 12px 35px #0002;max-width:430px}.brand{font-size:22px;font-weight:900;letter-spacing:4px;color:#0284c7}h1{margin:8px 0 10px}.desc{color:#555;line-height:1.6}#qrcode{display:flex;justify-content:center;margin:24px 0}#qrcode img{padding:10px;background:white;border-radius:12px}.url{font-size:12px;color:#777;word-break:break-all}</style></head><body><div class="card"><div class="brand">COFICAB</div><h1>TOOL SHOP</h1><p class="desc">Scan this QR code to open the COFICAB Tool Shop Finder.</p><div id="qrcode"></div><div class="url" id="url"></div></div><script>const siteUrl='https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/';document.getElementById('url').textContent=siteUrl;new QRCode(document.getElementById('qrcode'),{text:siteUrl,width:260,height:260,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});</script></body></html>
