<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COFICAB EGYPT Tool Shop QR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #eef3f5;
      font-family: Arial, sans-serif;
      color: #082f49;
    }
    .poster {
      width: min(92vw, 620px);
      margin: 28px auto;
      overflow: hidden;
      background: #fff;
      border: 5px solid #0b4f71;
      border-radius: 28px;
      box-shadow: 0 12px 35px #123c5526;
    }
    .top {
      padding: 25px 22px 18px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #06364e, #0b4f71 70%, #137a8b);
    }
    .brand {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .title {
      margin-top: 9px;
      font-size: 30px;
      font-weight: 800;
    }
    .sub {
      margin-top: 8px;
      font-size: 15px;
      opacity: .94;
    }
    .tagline {
      margin-top: 12px;
      color: #f2c400;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.2px;
    }
    .qr-area {
      padding: 28px 25px 20px;
      text-align: center;
    }
    .qr-frame {
      display: inline-block;
      padding: 18px;
      background: #fff;
      border: 6px solid #f2c400;
      border-radius: 22px;
      box-shadow: 0 5px 18px #123c5518;
    }
    #qrcode {
      width: 285px;
      height: 285px;
    }
    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 285px !important;
      height: 285px !important;
    }
    .instruction {
      margin: 17px 0 7px;
      font-size: 18px;
      font-weight: bold;
    }
    .url {
      color: #61737c;
      font-size: 10px;
      word-break: break-all;
      direction: ltr;
    }
    .cable {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-top: 4px solid #f2c400;
    }
    .caption {
      padding: 12px;
      color: #0b4f71;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }
    .print {
      display: block;
      margin: 0 auto 22px;
      padding: 12px 28px;
      border: 0;
      border-radius: 12px;
      background: #0b4f71;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .print:hover { background: #06364e; }
    @media print {
      body { background: #fff; }
      .poster { margin: 0 auto; box-shadow: none; }
      .print { display: none; }
    }
    @media (max-width: 430px) {
      .brand { font-size: 22px; }
      .title { font-size: 25px; }
      #qrcode, #qrcode img, #qrcode canvas {
        width: 240px !important;
        height: 240px !important;
      }
    }
  </style>
</head>
<body>
  <main class="poster">
    <header class="top">
      <div class="brand">COFICAB EGYPT</div>
      <div class="title">TOOL SHOP</div>
      <div class="sub">SCAN • SEARCH • FIND</div>
      <div class="tagline">CABLES FOR A BETTER TOMORROW</div>
    </header>

    <section class="qr-area">
      <div class="qr-frame">
        <div id="qrcode"></div>
      </div>
      <div class="instruction">Scan to open the Tool Shop Finder</div>
      <div class="url">https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/welcome.html</div>
    </section>

    <img class="cable" src="./coficab-cable-reference.jpg" alt="COFICAB cables">
    <div class="caption">Automotive Cables • Tooling • Technical Support</div>
    <button class="print" type="button" onclick="window.print()">Print QR Poster</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const welcomePage =
      "https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/welcome.html";

    new QRCode(document.getElementById("qrcode"), {
      text: welcomePage,
      width: 285,
      height: 285,
      colorDark: "#082f49",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
