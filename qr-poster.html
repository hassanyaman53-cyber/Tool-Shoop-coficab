<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COFICAB QR Code</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #082f49;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 360px;
      max-width: 92%;
      padding: 24px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 30px #0005;
    }

    h1 {
      margin: 0 0 8px;
      color: #082f49;
      font-size: 23px;
    }

    p {
      margin: 0 0 18px;
      color: #557080;
      font-size: 14px;
    }

    #qrcode {
      width: 260px;
      height: 260px;
      margin: auto;
      padding: 10px;
      background: white;
      border: 5px solid #f2c400;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .url {
      margin: 16px 0;
      color: #607786;
      font-size: 11px;
      direction: ltr;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #0b4f71;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #06364e;
    }

    @media print {
      body {
        background: white;
      }

      button {
        display: none;
      }

      .card {
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>COFICAB TOOL SHOP</h1>
    <p>امسح الكود لفتح صفحة الترحيب</p>

    <div id="qrcode"></div>

    <div class="url">
      https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/welcome.html
    </div>

    <button onclick="window.print( )">
      🖨️ طباعة QR Code
    </button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const welcomePage =
      "https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/welcome.html";

    new QRCode(document.getElementById("qrcode" ), {
      text: welcomePage,
      width: 240,
      height: 240,
      colorDark: "#082f49",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
