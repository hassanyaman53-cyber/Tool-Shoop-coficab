<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوستر ورشة كوفيكاب - COFICAB Tool Shop QR</title>
  <style>
    body {
      background-color: #eef2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .poster {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 450px;
      width: 100%;
      border-top: 8px solid #0088cc;
    }
    h1 {
      color: #0088cc;
      font-size: 26px;
      margin-bottom: 10px;
      font-weight: 800;
    }
    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .qr-box {
      background: #f9fbfd;
      padding: 20px;
      border: 2px dashed #0088cc;
      border-radius: 15px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-box img {
      width: 240px;
      height: 240px;
      display: block;
      margin: 0 auto;
    }
    .footer-note {
      font-size: 13px;
      color: #777;
      background: #f4f7f6;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="poster">
    <h1>COFICAB Tool Shop</h1>
    <p>قم بمسح الكود التالي بكاميرا الموبايل لفتح <b>نظام البحث الرقمي والصوتي</b> للدايات والعُدد فوراً:</p>
    
    <div class="qr-box">
      <!-- كود الـ QR مربوط مباشرة بصفحة البحث الخاصة بك -->
      <img src="https://quickchart.io/qr?text=https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/index.html&size=300" alt="COFICAB Tool Shop QR Code">
    </div>

    <div class="footer-note">
      🔧 إدارة Tool Shop - كوفيكاب
    </div>
  </div>

</body>
</html>
