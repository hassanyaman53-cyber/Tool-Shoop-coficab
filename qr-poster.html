```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COFICAB Tool Shop QR</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f4f7;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    width:min(430px,92%);
    background:white;
    border-radius:22px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:3px;
    color:#0b3154;
}

.title{
    margin-top:7px;
    font-size:18px;
    font-weight:700;
    color:#34495e;
}

#qr{
    margin:25px auto;
    width:280px;
    height:280px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
}

#qr img{
    width:280px;
    height:280px;
    display:block;
}

.scan{
    font-size:20px;
    font-weight:800;
    color:#0b4b78;
    margin-top:10px;
}

.small{
    margin-top:8px;
    color:#7a8792;
    font-size:13px;
    line-height:1.5;
}

.url{
    margin-top:15px;
    padding:10px;
    border-radius:9px;
    background:#f3f6f8;
    font-size:11px;
    color:#65727e;
    word-break:break-all;
}

button{
    margin-top:18px;
    border:0;
    padding:12px 20px;
    border-radius:10px;
    background:#0b4b78;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">COFICAB</div>

    <div class="title">
        TOOL & DIE SHOP
    </div>

    <div id="qr">
        Creating QR...
    </div>

    <div class="scan">
        SCAN TO SEARCH
    </div>

    <div class="small">
        Scan this QR code to open the<br>
        COFICAB Tool & Die Shop Finder.
    </div>

    <div class="url" id="targetUrl">
        Creating link...
    </div>

    <button onclick="openFinder()">
        OPEN FINDER
    </button>

</div>

<script>

/*
=========================================================
COFICAB QR SYSTEM
=========================================================

The target is generated automatically.

QR.index.html
       ↓
same folder
       ↓
index.html

Therefore no hard-coded Netlify/GitHub URL is required.
=========================================================
*/

const targetURL =
    new URL("index.html", window.location.href).href;

const qrSize = 280;

/*
Use QR Server as an IMAGE endpoint.
This avoids the previous QR JavaScript-library problem.
*/

const qrImageURL =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=" + qrSize + "x" + qrSize +
    "&margin=10" +
    "&data=" + encodeURIComponent(targetURL);

const qrContainer =
    document.getElementById("qr");

const image =
    document.createElement("img");

image.alt =
    "COFICAB Tool Shop Finder QR Code";

image.src =
    qrImageURL;

image.onload = function(){
    qrContainer.innerHTML = "";
    qrContainer.appendChild(image);
};

image.onerror = function(){

    qrContainer.innerHTML = `
        <div style="
            padding:20px;
            color:#b00020;
            font-weight:bold;
            line-height:1.5;
        ">
            QR could not be loaded.<br><br>
            Please check the internet connection.
        </div>
    `;
};

document.getElementById("targetUrl").textContent =
    targetURL;

function openFinder(){
    window.location.href = targetURL;
}

</script>

</body>
</html>
```
