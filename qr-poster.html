<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COFICAB - Tool Shop QR Poster</title>
    <style>
        @page { size: A4 portrait; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .poster { width: 100%; max-width: 600px; background: #ffffff; border: 5px solid #0284c7; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo { font-size: 38px; font-weight: 900; color: #0284c7; letter-spacing: 4px; }
        .sub { font-size: 15px; color: #64748b; font-weight: bold; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        .desc { font-size: 16px; color: #334155; margin-bottom: 25px; }
        .qr-box { background: #ffffff; padding: 15px; border: 3px dashed #0284c7; border-radius: 16px; display: inline-block; margin-bottom: 20px; }
        .qr-box img { width: 280px; height: 280px; display: block; margin: 0 auto; border-radius: 8px; }
        .cta { background-color: #0284c7; color: #ffffff; padding: 12px 24px; border-radius: 10px; font-size: 18px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .btn-print { background-color: #0f172a; color: #ffffff; border: none; padding: 12px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .footer { margin-top: 20px; font-size: 12px; color: #94a3b8; font-weight: 600; }
        @media print {
            body { background: #ffffff; padding: 0; }
            .poster { border: 5px solid #000000; box-shadow: none; border-radius: 0; max-width: 100%; }
            .btn-print { display: none; }
            .cta { background-color: #000000; }
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="logo">COFICAB</div>
        <div class="sub">Tool Shop & Die Shop Management</div>
        
        <div class="title">نظام البحث الرقمي ومتابعة العِدَد والدايات</div>
        <div class="desc">إدارة وتتبع مكونات خطوط السحب والكبس ورش الصيانة</div>
        
        <div class="qr-box">
            <img src="https://quickchart.io/qr?text=https://hassanyaman53-cyber.github.io/Tool-Shoop-coficab/&size=300&margin=2" alt="QR Code">
        </div>
        
        <br>
        <div class="cta">📱 امسح الرمز بالموبايل للوصول الفوري</div>
        <br>
        <button class="btn-print" onclick="window.print()">🖨️ طباعة البوستر الآن</button>
        
        <div class="footer">COFICAB Egypt Industrial Performance Team</div>
    </div>
</body>
</html>
