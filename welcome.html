<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to COFICAB Tool Shop</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #082f49;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(94%, 900px);
      text-align: center;
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0005;
    }

    img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    a {
      display: block;
      margin: 18px auto 4px;
      max-width: 360px;
      padding: 14px;
      border-radius: 12px;
      background: #0b4f71;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="box">
    <img src="./welcome.png" alt="COFICAB Tool Shop Welcome">

    <a href="./index.html">
      دخول إلى Tool Shop
    </a>
  </main>
</body>
</html>
