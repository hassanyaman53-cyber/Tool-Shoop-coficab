<title>COFICAB - Tool & Die Shop Finder</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f5f8;
    color:#17212b;
    min-height:100vh;
}

.header{
    background:linear-gradient(135deg,#071d35,#0b4b78);
    color:white;
    padding:22px 18px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
}

.subtitle{
    margin-top:6px;
    font-size:15px;
    opacity:.9;
}

.container{
    width:min(1100px,94%);
    margin:25px auto;
}

.search-box{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.search-box h2{
    margin-bottom:12px;
    font-size:20px;
}

#searchInput{
    width:100%;
    padding:16px;
    border:2px solid #d5dde5;
    border-radius:12px;
    font-size:18px;
    outline:none;
}

#searchInput:focus{
    border-color:#0b6ea8;
}

.hint{
    margin-top:9px;
    color:#687684;
    font-size:13px;
}

.results{
    margin-top:20px;
}

.result-card{
    background:white;
    border-radius:15px;
    margin-bottom:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border-left:6px solid #0b6ea8;
}

.result-title{
    font-size:21px;
    font-weight:800;
    color:#0b4b78;
    margin-bottom:10px;
}

.row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.info{
    background:#f5f8fa;
    border-radius:9px;
    padding:10px;
}

.label{
    font-size:11px;
    color:#6b7782;
    text-transform:uppercase;
    margin-bottom:4px;
}

.value{
    font-size:16px;
    font-weight:700;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#e8f4ea;
    color:#23723a;
    font-weight:700;
    font-size:12px;
}

.no-result{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:14px;
    color:#687684;
}

.report{
    margin-top:25px;
    text-align:center;
}

.report button{
    border:none;
    background:#17212b;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.footer{
    text-align:center;
    color:#7b8791;
    padding:25px;
    font-size:12px;
}
</style>
</head>

/* =========================
   SEARCH
========================= */

const input = document.getElementById("searchInput");
const results = document.getElementById("results");

function normalize(value){
    return String(value || "")
        .toLowerCase()
        .replace(/[ًٌٍَُِّْـ]/g,"")
        .replace(/٫/g,".")
        .trim();
}

function searchData(){
    const query = normalize(input.value);

    if(!query){
        results.innerHTML = `
            <div class="no-result">
                Start typing to search for a tool, dimension or location.
            </div>
        `;
        return;
    }

    const words = query.split(/\s+/).filter(Boolean);

    const found = DATA.filter(item => {

        const searchable = normalize([
            item.locker,
            item.drawer,
            item.item,
            item.category,
            item.dimension,
            item.row,
            item.status,
            "multi drawing",
            "rod",
            "bunching",
            "extrusion"
        ].join(" "));

        return words.every(word => searchable.includes(word));
    });

    if(!found.length){
        results.innerHTML = `
            <div class="no-result">
                No matching tool was found.<br><br>
                Please check the dimension, item name or locker.
            </div>
        `;
        return;
    }

    results.innerHTML = found.map(item => `

        <div class="result-card">

            <div class="result-title">
                📍 Locker ${escapeHTML(item.locker)}
            </div>

            <div class="row">

                <div class="info">
                    <div class="label">Location</div>
                    <div class="value">
                        Locker ${escapeHTML(item.locker)}
                        ${item.drawer ? " → Drawer " + escapeHTML(item.drawer) : ""}
                        ${item.row ? " → Row " + escapeHTML(item.row) : ""}
                    </div>
                </div>

                <div class="info">
                    <div class="label">Item</div>
                    <div class="value">
                        ${escapeHTML(item.item)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">Dimension</div>
                    <div class="value">
                        ${escapeHTML(item.dimension || "—")}
                    </div>
                </div>

                <div class="info">
                    <div class="label">Category</div>
                    <div class="value">
                        ${escapeHTML(item.category)}
                    </div>
                </div>

                <div class="info">
                    <div class="label">Status</div>
                    <div>
                        <span class="status">
                            ${escapeHTML(item.status)}
                        </span>
                    </div>
                </div>

            </div>

        </div>

    `).join("");
}

function escapeHTML(value){
    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

input.addEventListener("input", searchData);

function reportLocation(){

    const currentSearch = input.value.trim();

    const message =
        "Wrong Location Report\n\n" +
        "Search: " + (currentSearch || "Not specified") +
        "\n\nPlease verify the physical location of this item.";

    const subject = encodeURIComponent(
        "COFICAB Tool Shop - Wrong Location Report"
    );

    const body = encodeURIComponent(message);

    window.location.href =
        "mailto:?subject=" + subject + "&body=" + body;
}


/* Initial screen */
searchData();

</script>

</body>
